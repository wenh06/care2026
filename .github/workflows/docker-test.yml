name: Docker Image CI and Test

on:
  push:
    branches: [ docker-test ]
  pull_request:
    branches: [ master ]

env:
  status: alpha
  CARE2026_TEST: 1
  download_data_dir: ${{ github.workspace }}/download_data
  output_dir: ${{ github.workspace }}/output
  mount_data_dir: /input
  mount_output_dir: /output
  DOCKER_HUB_REPOSITORY: care2026-docker-image
  DOCKER_IMAGE_TAG: latest

jobs:

  build-and-test:
    if: contains(fromJson('["wenh06", "DeepPSP"]'), github.repository_owner)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Free disk space
      run: |
        echo "Free space before cleanup:"
        df -h
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "Free space after cleanup:"
        df -h

    # ----------------------------------------------------------------
    # Download fold_0 model zips from Google Drive → checkpoints/
    # ----------------------------------------------------------------
    - name: Download model zips
      env:
        GDRIVE_ID_500: ${{ secrets.MODEL_GDRIVE_ID_500 }}
        GDRIVE_ID_502: ${{ secrets.MODEL_GDRIVE_ID_502 }}
        GDRIVE_ID_521W: ${{ secrets.MODEL_GDRIVE_ID_521W }}
      run: |
        pip install gdown
        mkdir -p checkpoints

        for id_var in GDRIVE_ID_500 GDRIVE_ID_502 GDRIVE_ID_521W; do
          gdrive_id="${!id_var}"
          if [ -z "$gdrive_id" ]; then
            echo "  SKIP $id_var (not set)"
            continue
          fi
          ds_id=$(echo "$id_var" | sed 's/GDRIVE_ID_//' | tr '[:upper:]' '[:lower:]')
          zip_name="${ds_id}_f0_model.zip"
          echo "Downloading $zip_name ..."
          gdown -O "$zip_name" "$gdrive_id"
          unzip -q "$zip_name" -d checkpoints/
          rm "$zip_name"
        done

        echo "checkpoints/ layout:"
        find checkpoints -type f \( -name '*.pth' -o -name '*.json' \) | sort

    # ----------------------------------------------------------------
    # Build Docker image (COPY ./ → /challenge; post_docker_build.py)
    # ----------------------------------------------------------------
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }} .

    # ----------------------------------------------------------------
    # Download test data & smoke test
    # ----------------------------------------------------------------
    - name: Set up Python 3.10
      if: ${{ env.status != 'pre' }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Download test data
      if: ${{ env.status != 'pre' }}
      env:
        GDRIVE_ID_TEST_DATA: ${{ secrets.TEST_DATA_GDRIVE_ID }}
      run: |
        pip install gdown
        mkdir -p ${{ env.download_data_dir }} ${{ env.output_dir }}
        if [ -n "$GDRIVE_ID_TEST_DATA" ]; then
          echo "Downloading mini-mock-test-set.tar.gz ..."
          gdown -O mini-mock-test-set.tar.gz "$GDRIVE_ID_TEST_DATA"
          tar xzf mini-mock-test-set.tar.gz -C ${{ env.download_data_dir }}
          rm mini-mock-test-set.tar.gz
          echo "Test data:"
          find ${{ env.download_data_dir }} -type f | sort
        else
          echo "TEST_DATA_GDRIVE_ID not set — skipping smoke test."
        fi

    - name: Run the Docker image (smoke test)
      if: ${{ env.status != 'pre' && hashFiles(format('{0}/mini-mock-test-set/**/*.nii.gz', env.download_data_dir)) != '' }}
      run: |
        docker images
        docker run \
          -e PYTHONUNBUFFERED=1 \
          -e CARE2026_TEST=${{ env.CARE2026_TEST }} \
          -e CARE2026_ACTION_TEST=1 \
          -v ${{ env.download_data_dir }}/mini-mock-test-set:${{ env.mount_data_dir }}:ro \
          -v ${{ env.output_dir }}:${{ env.mount_output_dir }} \
          ${{ env.DOCKER_HUB_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}
        docker ps -a
        echo "Output files:"
        find ${{ env.output_dir }} -type f | sort
